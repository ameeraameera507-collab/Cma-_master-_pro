Question 1 - Cost Management
</h2>


<p>
A manufacturing company wants to improve cost accuracy.
Explain Activity-Based Costing (ABC), its advantages,
and situations where it should be used.
</p>


<textarea 
id="answer"
rows="12"
style="width:100%;padding:15px;"

</textarea>


<br><br>


<button class="btn btn-primary"
onclick="showAnswer()">

Submit Essay

</button>

</div>

<script>

function showAnswer(){

document.getElementById("model-answer").innerHTML = `

<h2>Model CMA Answer</h2>

<p>
Activity-Based Costing assigns overhead costs to products
based on activities that consume resources.

The process includes identifying activities,
determining cost drivers, calculating activity rates,
and assigning costs.

Advantages include improved costing accuracy,
better pricing decisions, and improved operational efficiency.
</p>

`;

}

</script>
