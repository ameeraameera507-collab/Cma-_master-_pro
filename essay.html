<span class="brand-word">
Master Pro
</span>

</button>

</div>

</header>





<main>


<section class="part-hero">


<p class="eyebrow">
CMA USA WRITTEN RESPONSE SYSTEM
</p>

</h1>


<p>
Practice CMA written response questions using professional exam-style answers,

<section class="section-block">


<h2>

</h2>

Choose Part 1 or Part 2 to start practice.

</p>

id="answer"
rows="12"

</main>






<script>


let currentAnswer = "";



function loadPart1(){


document.getElementById("essay-title").innerHTML =
"CMA Part 1 Essay - Cost Management";


document.getElementById("essay-question").innerHTML =

"A company is considering implementing Activity-Based Costing. Explain the concept of ABC, advantages, limitations and situations where it provides better information than traditional costing systems.";



currentAnswer = `

<h3>
Model Answer Structure
</h3>


<p>

Activity-Based Costing assigns overhead costs to products or services based on activities that consume resources.

</p>


<p>

The process involves identifying activities, determining cost drivers,
calculating activity rates and assigning costs according to usage.

</p>


<p>

Advantages include improved cost accuracy, better pricing decisions,
better product profitability analysis and improved operational decisions.

</p>


<p>

ABC is most useful when a company has diverse products,
high overhead costs and significant differences in resource consumption.

</p>

`;

}



function loadPart2(){


document.getElementById("essay-title").innerHTML =
"CMA Part 2 Essay - Investment Decisions";


document.getElementById("essay-question").innerHTML =

"A company is evaluating a new investment project. Explain capital budgeting methods including NPV, IRR and payback period.";



currentAnswer = `

<h3>
Model Answer Structure
</h3>


<p>

Capital budgeting evaluates long-term investment decisions.

</p>


<p>

Net Present Value measures the difference between present value of cash inflows and investment cost.

</p>


<p>

Internal Rate of Return represents the discount rate where NPV equals zero.

</p>


<p>

Payback period measures the time required to recover the initial investment.

</p>


<p>

For CMA decision-making, NPV is generally preferred because it considers the time value of money.

</p>

`;

}




function showAnswer(){


document.getElementById("model-answer").innerHTML = currentAnswer;


}


</script>
